<mat-card class="card" appearance="outlined">
  @if(title()) {
    <mat-card-header>
      <mat-card-title>{{ title() }}</mat-card-title>
      @if(subtitle()) {
        <mat-card-subtitle>{{ subtitle() }}</mat-card-subtitle>
      }
    </mat-card-header>
  }
  <mat-card-content>
        <ng-content />
  </mat-card-content>

  <ng-content select="[card-actions]" />
  
</mat-card>
