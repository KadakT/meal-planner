<div class="login__form">
    <ng-content select="h1"></ng-content>
    <form [formGroup]="loginForm" class="form__inputs" (ngSubmit)="onSubmit()">
        <div class="form__group field">
            <label class="form__label" for="username" >Username</label>
            <input formControlName="username" class="form__field" id="username" type="text">
        </div>

        <div class="form__group field">
            <label class="form__label" for="password">Password</label>
            <input formControlName="password" class="form__field" id="password" type="password">
        </div>

        <div class="form-group">
            <input formControlName="rememberMe" id="remember-me" type="checkbox">
            <label for="remember-me">Remember Me</label>
        </div>
         <ng-content select="app-buttons"></ng-content>
    </form>
   
   
</div>
